name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Write local.properties
        run: |
          cat > local.properties <<EOF
          sdk.dir=${ANDROID_HOME}
          OMDB_API_KEY=${{ secrets.OMDB_API_KEY }}
          TMDB_READ_ACCESS_TOKEN=${{ secrets.TMDB_READ_ACCESS_TOKEN }}
          EOF

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ShowTracker-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Check for release signing secrets
        id: keystore_check
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode release keystore
        if: steps.keystore_check.outputs.present == 'true'
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "${{ runner.temp }}/androidrelease.jks"

      - name: Build signed release APK
        if: steps.keystore_check.outputs.present == 'true'
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/androidrelease.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Upload release APK
        if: steps.keystore_check.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ShowTracker-release-apk
          path: app/build/outputs/apk/release/*.apk
